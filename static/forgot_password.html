<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รีเซ็ตรหัสผ่าน - น้องพาขวัญ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
    .brand-side { background: linear-gradient(135deg, #0ee950, #2b37df); }
    .logo-img { width: 140px; height: 140px; object-fit: contain; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100" style="max-width: 850px;">
    <div class="row g-0">
      <div class="col-12 col-md-5 brand-side text-white d-flex flex-column align-items-center justify-content-center p-4 text-center">
        <img class="logo-img rounded-circle bg-white p-2 shadow mb-3" src="/static/logo.png" alt="Logo">
        <h3 class="fw-bold m-0">PHAKWAN</h3>
        <span class="small opacity-75 mt-1">ตั้งรหัสผ่านใหม่</span>
      </div>

      <div class="col-12 col-md-7 p-4 p-md-5 bg-white d-flex flex-column justify-content-center">
        <div class="d-flex align-items-center mb-3">
          <a href="/login" class="text-primary text-decoration-none fw-bold fs-5 me-2">
            <i class="fa-solid fa-chevron-left"></i>
          </a>
          <h4 class="fw-bold m-0 text-primary">ลืมรหัสผ่าน</h4>
        </div>

        <div id="alert-box" class="alert py-2 text-center small d-none"></div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">ชื่อผู้ใช้ หรือ อีเมล ที่ลงทะเบียนไว้</label>
          <input type="text" id="ident" class="form-control" placeholder="กรอกชื่อผู้ใช้ หรือ อีเมล">
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">รหัสผ่านใหม่</label>
          <input type="password" id="p1" class="form-control" placeholder="ตั้งรหัสผ่านใหม่">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-secondary">ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="p2" class="form-control" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง">
        </div>

        <button class="btn btn-primary py-2 fw-semibold w-100 shadow-sm" onclick="handleReset()">
          เปลี่ยนรหัสผ่าน
        </button>
      </div>
    </div>
  </div>

  <script>
    async function handleReset() {
      const ident = document.getElementById('ident').value.trim();
      const p1 = document.getElementById('p1').value.trim();
      const p2 = document.getElementById('p2').value.trim();
      const alertBox = document.getElementById('alert-box');

      alertBox.className = 'alert py-2 text-center small d-none';

      if (!ident || !p1 || !p2) {
        alertBox.className = 'alert alert-danger py-2 text-center small';
        alertBox.innerText = 'กรุณากรอกข้อมูลให้ครบทุกช่อง';
        return;
      }
      if (p1 !== p2) {
        alertBox.className = 'alert alert-danger py-2 text-center small';
        alertBox.innerText = 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน';
        return;
      }

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: ident, new_password: p1 })
        });
        const data = await res.json();
        if (res.ok) {
          alertBox.className = 'alert alert-success py-2 text-center small';
          alertBox.innerText = 'เปลี่ยนรหัสผ่านสำเร็จ กำลังพากลับหน้าเข้าสู่ระบบ...';
          setTimeout(() => window.location.href = '/login', 1500);
        } else {
          alertBox.className = 'alert alert-danger py-2 text-center small';
          alertBox.innerText = data.detail || 'เกิดข้อผิดพลาด';
        }
      } catch {
        alertBox.className = 'alert alert-danger py-2 text-center small';
        alertBox.innerText = 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ';
      }
    }
  </script>
</body>
</html>
