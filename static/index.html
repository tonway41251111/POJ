<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ด - น้องพาขวัญ</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, sans-serif; }
    .stream-box { max-width: 640px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body class="p-2 p-md-4">

  <div class="container-fluid" style="max-width: 1000px;">
    <!-- แถบหัวเรื่อง + ปุ่มออกจากระบบ -->
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm flex-wrap gap-2">
      <h4 class="m-0 text-primary fw-bold">
        <i class="fa-solid fa-robot me-2"></i>แดชบอร์ดติดตามสถานะน้องพาขวัญ
      </h4>
      <button class="btn btn-outline-danger btn-sm" onclick="handleLogout()">
        <i class="fa-solid fa-right-from-bracket me-1"></i>ออกจากระบบ
      </button>
    </div>

    <!-- ส่วนภาพสดจากกล้อง -->
    <div class="card border-0 shadow-sm rounded-3 mb-4">
      <div class="card-header bg-white border-0 pt-3">
        <h5 class="card-title fw-bold m-0"><i class="fa-solid fa-video text-danger me-2"></i>ภาพสดจากหุ่นยนต์</h5>
      </div>
      <div class="card-body text-center p-2 p-md-3">
        <div class="stream-box shadow-sm">
          <img class="img-fluid w-100" src="/video_feed" alt="กำลังเชื่อมต่อกล้อง...">
        </div>
      </div>
    </div>

    <!-- การ์ดสถานะเซ็นเซอร์ 3 ช่อง (Responsive Grid) -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-3 h-100 p-3 text-center border-start border-4 border-danger">
          <span class="text-secondary small fw-bold">สถานะการล้มล่าสุด</span>
          <div id="fall-status" class="fs-4 fw-bold mt-2">-</div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card border-0 shadow-sm rounded-3 h-100 p-3 text-center border-start border-4 border-warning">
          <span class="text-secondary small fw-bold">อุณหภูมิ</span>
          <div id="temp" class="fs-4 fw-bold text-dark mt-2">- °C</div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card border-0 shadow-sm rounded-3 h-100 p-3 text-center border-start border-4 border-info">
          <span class="text-secondary small fw-bold">ความชื้น</span>
          <div id="humid" class="fs-4 fw-bold text-dark mt-2">- %</div>
        </div>
      </div>
    </div>

    <!-- ตารางประวัติเหตุการณ์ -->
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-header bg-white border-0 pt-3">
        <h5 class="card-title fw-bold m-0"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>ประวัติข้อมูลเซ็นเซอร์ล่าสุด</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 text-center">
            <thead class="table-danger">
              <tr>
                <th>เวลา</th>
                <th>สถานะการล้ม</th>
                <th>อุณหภูมิ (°C)</th>
                <th>ความชื้น (%)</th>
              </tr>
            </thead>
            <tbody id="log-table-body">
              <tr><td colspan="4" class="py-4 text-muted">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!document.cookie.includes('logged_in=true')) {
      window.location.href = '/login';
    }

    async function handleLogout() {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } finally {
        window.location.href = '/login';
      }
    }

    async function updateDashboard() {
      try {
        const res = await fetch('/api/logs');
        const data = await res.json();

        if (Array.isArray(data) && data.length > 0) {
          const latest = data[0];
          const fallElem = document.getElementById('fall-status');
          if (latest.fall_detected) {
            fallElem.innerHTML = '<span class="text-danger">🚨 ตรวจพบล้ม!</span>';
          } else {
            fallElem.innerHTML = '<span class="text-success">ปกติ</span>';
          }

          document.getElementById('temp').innerText = (latest.temperature ?? '-') + ' °C';
          document.getElementById('humid').innerText = (latest.humidity ?? '-') + ' %';

          const tbody = document.getElementById('log-table-body');
          tbody.innerHTML = data.map(item => `
            <tr>
              <td>${item.created_at ? new Date(item.created_at).toLocaleString('th-TH') : '-'}</td>
              <td>${item.fall_detected ? '<span class="badge bg-danger">ตรวจพบล้ม</span>' : '<span class="badge bg-success">ปกติ</span>'}</td>
              <td>${item.temperature ?? '-'}</td>
              <td>${item.humidity ?? '-'}</td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error("โหลดข้อมูลล้มเหลว:", err);
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 2000);
  </script>
</body>
</html>
