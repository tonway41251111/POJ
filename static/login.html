<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ - น้องพาขวัญ</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
    .brand-side { background: linear-gradient(135deg, #0ee950, #2b37df); }
    .logo-img { width: 140px; height: 140px; object-fit: contain; }
    @media (min-width: 768px) {
      .logo-img { width: 220px; height: 220px; }
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-2 p-md-4">

  <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100" style="max-width: 900px;">
    <div class="row g-0">
      <!-- ฝั่งแบรนด์ -->
      <div class="col-12 col-md-5 brand-side text-white d-flex flex-column align-items-center justify-content-center p-4 text-center">
        <img class="logo-img rounded-circle bg-white p-2 shadow mb-3" src="/static/logo.png" alt="Logo">
        <h2 class="fw-bold tracking-wide m-0">PHAKWAN</h2>
        <span class="small opacity-75 mt-1">WHERE · THINGS · CHAT</span>
      </div>

      <!-- ฝั่งฟอร์มเข้าสู่ระบบ -->
      <div class="col-12 col-md-7 p-4 p-md-5 bg-white d-flex flex-column justify-content-center">
        <h4 class="text-primary fw-bold text-center text-md-start mb-4">
          ยินดีต้อนรับ<br><span class="fs-5 text-secondary">เข้าสู่ระบบน้องพาขวัญ</span>
        </h4>

        <div id="err-msg" class="alert alert-danger py-2 text-center small d-none" role="alert">
          ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">ชื่อผู้ใช้ หรือ อีเมล</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="fa-regular fa-user"></i></span>
            <input type="text" id="user" class="form-control" placeholder="ใส่ชื่อผู้ใช้ หรือ อีเมล">
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-semibold text-secondary">รหัสผ่าน</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="pass" class="form-control" placeholder="ใส่รหัสผ่าน">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass()">
              <i class="fa-regular fa-eye-slash" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <div class="text-end mb-4">
         <a href="/forgot-password" class="small text-decoration-none text-primary">ลืมรหัสผ่าน?</a>
        </div>

        <button class="btn btn-primary py-2 fw-semibold w-100 shadow-sm mb-3" onclick="handleLogin()">
          เข้าสู่ระบบ
        </button>

        <hr class="text-muted my-3">

        <div class="text-center small text-secondary">
          ยังไม่มีบัญชีใช้งาน?<br>
          <a href="/signup" class="fw-semibold text-primary text-decoration-none">ลงทะเบียนกับ ระบบ</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePass() {
      const pass = document.getElementById('pass');
      const icon = document.getElementById('toggle-icon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        pass.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    async function handleLogin() {
      const username = document.getElementById('user').value.trim();
      const password = document.getElementById('pass').value.trim();
      const err = document.getElementById('err-msg');
      err.classList.add('d-none');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.innerText = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
          err.classList.remove('d-none');
        }
      } catch {
        err.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
        err.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
