<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน - Robot Monitor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #eef2f6; padding: 30px 15px;
    }
    .signup-card {
      display: flex; width: 920px; background: white;
      border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .brand-side {
      flex: 1; background: linear-gradient(135deg, #0ee950, #2b37df);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; padding: 40px; text-align: center;
    }
    .logo-img {
      width: 200px; height: 200px; border-radius: 50%;
      background: white; padding: 6px; margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); object-fit: contain;
    }
    .brand-title {
      font-size: 40px; font-weight: 800; letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .brand-title span { color: hsl(100, 100%, 99%); }
    .brand-subtitle {
      font-size: 13px; font-weight: 600; letter-spacing: 3px;
      margin-top: 10px; opacity: 0.9;
    }
    .form-side {
      flex: 1.1; padding: 35px 45px; display: flex; flex-direction: column;
      justify-content: center; max-height: 90vh; overflow-y: auto;
    }
    .back-nav {
      display: inline-flex; align-items: center; gap: 8px;
      color: #1e88e5; text-decoration: none; font-size: 18px; font-weight: 700;
      margin-bottom: 20px; cursor: pointer;
    }
    .back-nav:hover { text-decoration: underline; }
    .input-group { margin-bottom: 12px; }
    .input-label {
      display: block; font-size: 13px; color: #444; margin-bottom: 5px; font-weight: 600;
    }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%; padding: 10px 14px; border: 1px solid #d0d7de;
      border-radius: 6px; font-size: 14px; background: #fff; transition: all 0.2s;
    }
    .input-wrapper input:focus {
      border-color: #1e88e5; outline: none;
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
    }
    .toggle-icon {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #888; cursor: pointer; font-size: 14px;
    }
    .phone-wrapper {
      display: flex; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden;
    }
    .phone-country {
      background: #f8fafc; border-right: 1px solid #d0d7de;
      padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555;
    }
    .phone-wrapper input {
      border: none; border-radius: 0; flex: 1; padding: 10px 14px; outline: none;
    }
    .terms-group {
      display: flex; align-items: center; gap: 8px; margin: 15px 0 20px; font-size: 12px; color: #555;
    }
    .terms-group a { color: #1e88e5; text-decoration: none; }
    .terms-group a:hover { text-decoration: underline; }
    .btn-signup {
      width: 100%; padding: 12px; background: #e0e0e0; color: #888;
      border: 1px solid #ccc; border-radius: 6px; font-size: 15px; font-weight: 600;
      cursor: not-allowed; transition: all 0.2s;
    }
    .btn-signup.active {
      background: #1e88e5; color: white; border-color: #1e88e5; cursor: pointer;
    }
    .btn-signup.active:hover { background: #1565c0; }
  </style>
</head>
<body>

  <div class="signup-card">
    <div class="brand-side">
      <img class="logo-img" src="/static/logo.png" alt="Logo">
      <div class="brand-title"><span>PHAKWAN</span></div>
      <div class="brand-subtitle">WHERE · THINGS · CHAT</div>
    </div>

    <div class="form-side">
      <a href="/login" class="back-nav">
        <i class="fa-solid fa-chevron-left"></i> ลงทะเบียน
      </a>

      <div class="input-group">
        <label class="input-label">ชื่อจริง</label>
        <div class="input-wrapper">
          <input type="text" id="fname" placeholder="กรอกชื่อจริงของคุณ">
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">นามสกุล</label>
        <div class="input-wrapper">
          <input type="text" id="lname" placeholder="กรอกนามสกุลของคุณ">
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">ชื่อผู้ใช้ (Username)</label>
        <div class="input-wrapper">
          <input type="text" id="uname" placeholder="ตั้งชื่อผู้ใช้ภาษาอังกฤษ/ตัวเลข">
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">อีเมล</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="example@mail.com">
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">รหัสผ่าน</label>
        <div class="input-wrapper">
          <input type="password" id="pass1" placeholder="เลือกรหัสผ่าน">
          <i class="fa-regular fa-eye-slash toggle-icon" onclick="togglePass('pass1', this)"></i>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">ยืนยันรหัสผ่าน</label>
        <div class="input-wrapper">
          <input type="password" id="pass2" placeholder="กรอกรหัสผ่านอีกครั้ง">
          <i class="fa-regular fa-eye-slash toggle-icon" onclick="togglePass('pass2', this)"></i>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">หมายเลขโทรศัพท์</label>
        <div class="phone-wrapper">
          <div class="phone-country">
            <span>🇹🇭</span> +66
          </div>
          <input type="tel" id="phone" placeholder="หมายเลขโทรศัพท์">
        </div>
      </div>

      <div class="terms-group">
        <input type="checkbox" id="terms" onchange="toggleButton(this)">
        <label for="terms">ฉันยอมรับ <a href="#">นโยบายความเป็นส่วนตัว</a> และ <a href="#">ข้อกำหนดการใช้งาน</a></label>
      </div>

      <button type="button" id="btn-submit" class="btn-signup" onclick="handleSignUp()">ลงทะเบียน</button>
    </div>
  </div>

  <script>
    function togglePass(id, icon) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    function toggleButton(cb) {
      const btn = document.getElementById('btn-submit');
      if (cb.checked) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    async function handleSignUp() {
      const cb = document.getElementById('terms');
      if (!cb.checked) {
        alert('กรุณายอมรับเงื่อนไขและข้อกำหนดก่อนลงทะเบียน');
        return;
      }

      const p1 = document.getElementById('pass1').value.trim();
      const p2 = document.getElementById('pass2').value.trim();

      if (!p1 || !p2) {
        alert('กรุณากรอกรหัสผ่าน');
        return;
      }
      if (p1 !== p2) {
        alert('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');
        return;
      }

      const payload = {
        first_name: document.getElementById('fname').value.trim(),
        last_name: document.getElementById('lname').value.trim(),
        username: document.getElementById('uname').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: p1,
        phone: document.getElementById('phone').value.trim()
      };

      if (!payload.first_name || !payload.username || !payload.email) {
        alert('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน');
        return;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          alert('ลงทะเบียนสำเร็จ! สามารถใช้ชื่อผู้ใช้ หรือ อีเมล ในการเข้าสู่ระบบได้ทันที');
          window.location.href = '/login';
        } else {
          alert('ลงทะเบียนไม่สำเร็จ: ' + (data.detail || 'เกิดข้อผิดพลาด'));
        }
      } catch (err) {
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      }
    }
  </script>
</body>
</html>
