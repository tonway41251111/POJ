<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียน - น้องพาขวัญ</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #eef2f6; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
    .brand-side { background: linear-gradient(135deg, #0ee950, #2b37df); }
    .logo-img { width: 120px; height: 120px; object-fit: contain; }
    @media (min-width: 768px) {
      .logo-img { width: 180px; height: 180px; }
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-2 p-md-4">

  <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100 my-auto" style="max-width: 920px;">
    <div class="row g-0">
      <!-- ฝั่งแบรนด์ -->
      <div class="col-12 col-md-5 brand-side text-white d-flex flex-column align-items-center justify-content-center p-4 text-center">
        <img class="logo-img rounded-circle bg-white p-2 shadow mb-3" src="/static/logo.png" alt="Logo">
        <h2 class="fw-bold tracking-wide m-0">PHAKWAN</h2>
        <span class="small opacity-75 mt-1">WHERE · THINGS · CHAT</span>
      </div>

      <!-- ฝั่งฟอร์มลงทะเบียน -->
      <div class="col-12 col-md-7 p-4 p-md-5 bg-white">
        <div class="d-flex align-items-center mb-3">
          <a href="/login" class="text-primary text-decoration-none fw-bold fs-5 me-2">
            <i class="fa-solid fa-chevron-left"></i>
          </a>
          <h4 class="fw-bold m-0 text-primary">ลงทะเบียน</h4>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-12 col-sm-6">
            <label class="form-label small fw-semibold text-secondary">ชื่อจริง</label>
            <input type="text" id="fname" class="form-control" placeholder="ชื่อจริง">
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label small fw-semibold text-secondary">นามสกุล</label>
            <input type="text" id="lname" class="form-control" placeholder="นามสกุล">
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-semibold text-secondary">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="uname" class="form-control" placeholder="ตั้งชื่อผู้ใช้ภาษาอังกฤษ/ตัวเลข">
        </div>

        <div class="mb-2">
          <label class="form-label small fw-semibold text-secondary">อีเมล</label>
          <input type="email" id="email" class="form-control" placeholder="example@mail.com">
        </div>

        <div class="mb-2">
          <label class="form-label small fw-semibold text-secondary">รหัสผ่าน</label>
          <div class="input-group">
            <input type="password" id="pass1" class="form-control" placeholder="รหัสผ่าน">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('pass1', this)">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-semibold text-secondary">ยืนยันรหัสผ่าน</label>
          <div class="input-group">
            <input type="password" id="pass2" class="form-control" placeholder="ยืนยันรหัสผ่านอีกครั้ง">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('pass2', this)">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">หมายเลขโทรศัพท์</label>
          <div class="input-group">
            <span class="input-group-text bg-light">🇹🇭 +66</span>
            <input type="tel" id="phone" class="form-control" placeholder="เบอร์โทรศัพท์">
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" onchange="toggleBtn(this)">
          <label class="form-check-label small text-secondary" for="terms">
            ฉันยอมรับ <a href="#" class="text-primary text-decoration-none">นโยบายความเป็นส่วนตัว</a> และ <a href="#" class="text-primary text-decoration-none">ข้อกำหนดการใช้งาน</a>
          </label>
        </div>

        <button type="button" id="btn-submit" class="btn btn-primary w-100 py-2 fw-semibold disabled" onclick="handleSignUp()">
          ลงทะเบียน
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    function toggleBtn(cb) {
      const btn = document.getElementById('btn-submit');
      if (cb.checked) {
        btn.classList.remove('disabled');
      } else {
        btn.classList.add('disabled');
      }
    }

    async function handleSignUp() {
      const cb = document.getElementById('terms');
      if (!cb.checked) return;

      const p1 = document.getElementById('pass1').value.trim();
      const p2 = document.getElementById('pass2').value.trim();

      if (!p1 || !p2) {
        alert('กรุณากรอกรหัสผ่านให้ครบ');
        return;
      }
      if (p1 !== p2) {
        alert('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
        return;
      }

      const payload = {
        first_name: document.getElementById('fname').value.trim(),
        last_name: document.getElementById('lname').value.trim(),
        username: document.getElementById('uname').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: p1,
        phone: document.getElementById('phone').value.trim()
      };

      if (!payload.first_name || !payload.username || !payload.email) {
        alert('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน');
        return;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          alert('ลงทะเบียนสำเร็จ! สามารถนำชื่อผู้ใช้หรืออีเมลไปเข้าสู่ระบบได้ทันที');
          window.location.href = '/login';
        } else {
          alert('ลงทะเบียนไม่สำเร็จ: ' + (data.detail || 'เกิดข้อผิดพลาด'));
        }
      } catch {
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      }
    }
  </script>
</body>
</html>
